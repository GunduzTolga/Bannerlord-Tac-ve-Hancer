# Her gönderimde modu oyunsuz derler (NuGet referans DLL'leri) ve birim testlerini çalıştırır.
name: Derleme ve testler

on:
  push:
  pull_request:
  workflow_dispatch:  # Actions sekmesinden elle de çalıştırılabilsin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Mod
        run: dotnet build src/CheatMenu.csproj -c Release -nologo
      - name: Testler
        run: dotnet run --project tests/CheatMenu.Tests/CheatMenu.Tests.csproj -c Release -f net8.0
      # Gauntlet prefab'ları oyunun referans DLL'lerine ve ViewModel'lere karşı (parça, özellik, bağlantı, fırça adları);
      # yeniden yaptığımız paketli mod panelleri de o modun DLL'ine karşı.
      - name: Arayüz denetimi
        run: |
          P=~/.nuget/packages
          dotnet run --project tools/GuiCheck/GuiCheck.csproj -c Release -- Module/GUI src/bin/Release/CheatMenu.dll \
            $P/bannerlord.referenceassemblies.core/1.4.8.119303/ref/net472 \
            $P/bannerlord.referenceassemblies.sandbox/1.4.8.119303/ref/net472 \
            $P/bannerlord.uiextenderex/2.13.3/lib/netstandard2.0 \
            --bundled third_party
      # Paket oyunun Modules klasörüne doğrudan kopyalanacak yapıda: CheatMenu/SubModule.xml, GUI/, Images/, bin/Win64_Shipping_Client/...
      - name: Kurulum paketi
        run: |
          mkdir -p package/CheatMenu/bin/Win64_Shipping_Client
          cp -r Module/. package/CheatMenu/
          cp src/bin/Release/CheatMenu.dll src/bin/Release/CheatMenu.pdb package/CheatMenu/bin/Win64_Shipping_Client/
      - uses: actions/upload-artifact@v4
        with:
          name: TacVeHancer
          path: package/
